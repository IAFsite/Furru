<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAF Reader</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0f0f12;
  color:white;
}

/* ===== TOPBAR ===== */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:20px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:999;
  background:linear-gradient(to bottom, rgba(15,15,18,.9), transparent);
  backdrop-filter:blur(4px);
}

.logo img{
  height:40px;
  opacity:.9;
}

.back-btn{
  text-decoration:none;
  color:white;
  background:rgba(255,255,255,.06);
  padding:10px 18px;
  border-radius:999px;
  transition:.2s;
}

.back-btn:hover{
  background:rgba(255,255,255,.12);
}

/* ===== BG ===== */
.bg{
  position:fixed;
  inset:0;
  z-index:-2;
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  opacity:1;
  transform:scale(1.05);
}

.overlay{
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    linear-gradient(to bottom, rgba(15,15,18,.95), rgba(15,15,18,.88));
}

/* ===== CONTENT ===== */
.container{
  max-width:900px;
  margin:auto;
  padding:
    140px
    40px
    120px;
}

.reg{
  color:#666;
  font-size:13px;
  letter-spacing:1px;
  margin-bottom:14px;
}

.title{
  font-size:54px;
  line-height:1.1;
  margin-bottom:14px;
}

.meta{
  color:#999;
  margin-bottom:60px;
  font-size:15px;
}

.content{
  font-size:20px;
  line-height:1.95;
  color:#ddd;
  white-space:pre-wrap;
}

/* mobile */
@media(max-width:800px){

  .container{
    padding:
      110px
      24px
      80px;
  }

  .title{
    font-size:34px;
  }

  .content{
    font-size:17px;
    line-height:1.85;
  }
}
</style>
</head>
<body>

<div class="bg" id="bg"></div>
<div class="overlay"></div>

<div class="topbar">
  <a href="index.html" class="back-btn">← Back</a>

  <div class="logo">
    <img src="../iaf-logo.png">
  </div>
</div>

<div class="container">
  <div class="reg" id="reg"></div>
  <div class="title" id="title"></div>
  <div class="meta" id="meta"></div>
  <div class="content" id="content"></div>
</div>

<script>
function getID(){
  const params=new URLSearchParams(location.search);
  return params.get("id");
}

function parsePrefix(reg){
  return reg.match(/^[A-Z]+/)?.[0] || "DOC";
}

function bgOf(prefix){
  const map={
    DOC:"../img/pic/Deu.png",
    FDOC:"../img/pic/Felo.png",
    DLOG:"../img/pic/Fela.png",
    FIMO:"../img/pic/Vix.png",
    REP:"../img/pic/Vix.png"
  };

  return map[prefix] || "../img/pic/Deu.png";
}

async function load(){

  const id=getID();

  const res=await fetch("data.json");
  const data=await res.json();

  const file=data.find(v=>v.reg_id===id);

  if(!file) return;

  const prefix=parsePrefix(file.reg_id);

  document.getElementById("bg").style.backgroundImage =
    `url("${bgOf(prefix)}")`;

  document.title=file.title;

  document.getElementById("reg").textContent =
    "REG-ID : " + file.reg_id;

  document.getElementById("title").textContent =
    file.title;

  document.getElementById("meta").textContent =
    prefix + " FILE";

  document.getElementById("content").textContent =
    file.content;
}

load();
</script>

</body>
</html>
